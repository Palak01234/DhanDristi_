    <text x="65" y="256">200</text>
    <text x="65" y="216">400</text>
    <text x="65" y="176">600</text>
    <text x="65" y="136">800</text>
    <text x="65" y="96">1000</text>
    <text x="65" y="56">1200</text>
  </g>

  <g fill="#111111">
