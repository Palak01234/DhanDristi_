    <rect x="158" y="143" width="42" height="150"/>
    <rect x="222" y="109" width="42" height="184"/>
    <rect x="286" y="160" width="42" height="133"/>
    <rect x="350" y="132" width="42" height="161"/>
    <rect x="414" y="153" width="42" height="140"/>
  </g>

  <g fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="middle">
    <text x="115" y="311">USD</text>
    <text x="179" y="311">PHP</text>
    <text x="243" y="311">INR</text>
    <text x="307" y="311">EUR</text>
    <text x="371" y="311">AUD</text>
    <text x="435" y="311">CAD</text>
  </g>

  <text x="267.5" y="339" fill="#222222" font-family="Arial, Helvetica, sans-serif"
