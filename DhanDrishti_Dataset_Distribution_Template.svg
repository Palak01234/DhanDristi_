<svg xmlns="http://www.w3.org/2000/svg" width="535" height="390" viewBox="0 0 535 390">
  <rect width="535" height="390" fill="white"/>

  <text x="267.5" y="24" fill="#222222" font-family="Arial, Helvetica, sans-serif"
        font-size="16" text-anchor="middle">Dataset Distribution</text>

  <g stroke="#bdbdbd" stroke-width="1">
    <line x1="72" y1="53" x2="468" y2="53"/>
    <line x1="72" y1="93" x2="468" y2="93"/>
    <line x1="72" y1="133" x2="468" y2="133"/>
    <line x1="72" y1="173" x2="468" y2="173"/>
    <line x1="72" y1="213" x2="468" y2="213"/>
    <line x1="72" y1="253" x2="468" y2="253"/>
  </g>
  <line x1="72" y1="293" x2="468" y2="293" stroke="#333333" stroke-width="1.2"/>
  <line x1="72" y1="53" x2="72" y2="293" stroke="#333333" stroke-width="1.2"/>

  <g fill="#222222" font-family="Arial, Helvetica, sans-serif" font-size="10" text-anchor="end">
